[package]
name = "ase-llm"
version.workspace = true
edition.workspace = true

[dependencies]
ase-core = { path = "../ase-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Networking_WinHttp"] }
