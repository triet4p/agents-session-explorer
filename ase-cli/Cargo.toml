[package]
name = "ase-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ase"
path = "src/main.rs"

[dependencies]
ase-core = { path = "../ase-core" }
ase-index = { path = "../ase-index" }
ase-postings = { path = "../ase-postings" }
ase-ingest = { path = "../ase-ingest" }
ase-naming = { path = "../ase-naming" }
ase-delegation = { path = "../ase-delegation" }
ase-markers = { path = "../ase-markers" }
ase-task = { path = "../ase-task" }
ase-motif = { path = "../ase-motif" }
ase-adapter-omp-stock = { path = "../ase-adapter-omp-stock" }
ase-work = { path = "../ase-work" }
ase-judge = { path = "../ase-judge" }
ase-llm = { path = "../ase-llm" }
regex = "1"
rayon = "1"
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
zstd = "0.14"
